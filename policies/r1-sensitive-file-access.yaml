apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: r1-sensitive-file-access

spec:
  kprobes:
    - call: security_file_permission
      syscall: false
      return: true

      args:
        - index: 0
          type: file

        - index: 1
          type: int

      returnArg:
        index: 0
        type: int

      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - "/home/bahrini/zero-day-hunter/lab/secrets.txt"
